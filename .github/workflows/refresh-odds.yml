name: Refresh Odds

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Fetch odds
        run: uv run --with curl_cffi python3 src/odds-scraper/scripts/fetch_odds.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/odds-scraper/odds.json
          git diff --staged --quiet || git commit -m "chore: refresh odds data"
          git push
