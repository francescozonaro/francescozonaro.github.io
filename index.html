    <style>html,body,#root{color:#161616;background-color:#f0f0f0;min-height:100vh;margin:0;padding:0}html.dark-theme,html.dark-theme body,html.dark-theme #root{color:#f0f0f0;background-color:#1b1b1b}</style>
    <script>
      (function () {
        try {
          // Light-first design: defaults to light theme unless "dark" is explicitly stored.
          var stored = localStorage.getItem("theme");
          var isDark = stored === "dark";
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark-theme");
            root.classList.remove("light-theme");
          } else {
            root.classList.add("light-theme");
            root.classList.remove("dark-theme");
          }
        } catch (e) {}
      })();
    </script>
